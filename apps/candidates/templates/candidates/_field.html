<div class="field{% if f.errors %} has-error{% endif %}{% if cls %} {{ cls }}{% endif %}"{% if show %} data-show-when="{{ show }}"{% endif %}>
  {% if f.field.widget.input_type == "checkbox" %}
    <label class="check">{{ f }} <span>{{ f.label }}{% if f.field.required %} <span class="req">*</span>{% endif %}</span></label>
  {% elif f.field.widget.input_type == "radio" %}
    <label>{{ f.label }}</label>
    <div class="radios">{% for r in f %}<label>{{ r.tag }} {{ r.choice_label }}</label>{% endfor %}</div>
  {% else %}
    <label for="{{ f.id_for_label }}">{{ f.label }}{% if f.field.required %} <span class="req">*</span>{% endif %}</label>
    {{ f }}
  {% endif %}
  {% if f.help_text %}<p class="help">{{ f.help_text }}</p>{% endif %}
  {% for e in f.errors %}<p class="err">{{ e }}</p>{% endfor %}
</div>
